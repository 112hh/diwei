  <style>
    :root {
      --primary:#1A365D; --tech:#1F63FF; --emerald:#00A86B; --bg:#DCEBFF;
      --card:#FFFFFF; --amber:#D69E2E; --line:#D7E4F8; --muted:#71829A; --danger:#DC2626;
      --nav:#D8E9FF; --nav-strong:#C8DFFF; --content:#EEF6FF;
    }
    * { box-sizing: border-box; }
    html,body { min-width:1280px; min-height:100%; background:linear-gradient(120deg,#cfe2ff 0%,#e8f3ff 48%,#d9eaff 100%); color:#1F2937; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif; font-size:14px; }
    button,input,select,textarea { font:inherit; }
    button { transition: all .18s ease; }
    .mono { font-family:Consolas,"SFMono-Regular",Menlo,monospace; }
    .app-shell { display:grid; grid-template-columns:200px 1fr; min-height:100vh; padding-top:64px; }
    .topbar { position:fixed; inset:0 0 auto 0; height:64px; z-index:40; display:grid; grid-template-columns:200px 1fr auto; align-items:center; gap:16px; padding:0 16px; background:rgba(207,226,255,.84); color:#21324A; backdrop-filter:blur(14px); }
    .brand { display:flex; align-items:center; gap:10px; min-width:0; }
    .brand-mark { width:28px; height:28px; border-radius:999px; display:grid; place-items:center; color:#1F63FF; background:#fff; border:1px solid rgba(31,99,255,.34); box-shadow:0 2px 8px rgba(31,99,255,.16); }
    .brand-name { font-size:15px; font-weight:800; color:#111827; white-space:nowrap; }
    .top-center { display:flex; align-items:center; justify-content:center; gap:18px; }
    .top-search { width:330px; height:40px; border:0; border-radius:999px; background:rgba(255,255,255,.72); padding:0 18px 0 44px; color:#334155; outline:none; }
    .top-search-wrap { position:relative; }
    .top-search-wrap svg { position:absolute; left:16px; top:10px; color:#475569; }
    .top-actions { display:flex; align-items:center; justify-content:flex-end; gap:14px; }
    .top-link { min-height:40px; display:inline-flex; align-items:center; gap:6px; color:#4B5D76; border-radius:999px; padding:0 8px; }
    .top-link:hover { color:var(--tech); background:rgba(255,255,255,.45); }
    .portal-btn { min-height:40px; border-radius:999px; padding:0 20px; background:var(--tech); color:#fff; font-weight:700; box-shadow:0 8px 18px rgba(31,99,255,.22); }
    .avatar-pill { min-height:40px; border-radius:999px; padding:4px 10px 4px 5px; background:rgba(255,255,255,.58); display:flex; align-items:center; gap:8px; color:#1E293B; }
    .avatar { width:32px; height:32px; border-radius:999px; background:radial-gradient(circle at 35% 28%,#fff 0 18%,#8DB6FF 20% 46%,#2A65FF 47% 100%); box-shadow:0 0 0 4px rgba(255,255,255,.52); }
    .sidebar { position:fixed; top:64px; left:0; bottom:0; width:clamp(300px,20vw,360px); z-index:30; background:rgba(216,233,255,.7); color:#2D4059; overflow:auto; padding:0 16px 16px; }
    .sidebar.collapsed { width:72px; padding-inline:10px; }
    .sidebar.collapsed .label,.sidebar.collapsed .chev,.sidebar.collapsed .child-wrap { display:none; }
    .app-shell.collapsed { grid-template-columns:72px 1fr; }
    .main { grid-column:2; min-height:calc(100vh - 64px); margin:0 16px 16px 0; padding:16px; border:1px solid rgba(255,255,255,.88); border-radius:6px; background:rgba(238,246,255,.58); box-shadow:inset 0 0 0 1px rgba(119,166,230,.18); }
    .nav-btn { width:100%; min-height:42px; display:flex; align-items:center; gap:10px; padding:10px 16px; border-radius:4px; border:1px solid transparent; color:#2D4059; font-weight:650; }
    .nav-btn:hover { background:rgba(255,255,255,.42); color:var(--tech); }
    .nav-btn.active { background:rgba(255,255,255,.62); border-color:rgba(255,255,255,.72); color:var(--tech); }
    .nav-icon { width:17px; height:17px; flex:0 0 auto; }
    .label { min-width:0; overflow:visible; text-overflow:clip; white-space:normal; overflow-wrap:anywhere; line-height:20px; }
    .child-wrap { margin:4px 0 8px 28px; display:grid; gap:2px; }
    .child-btn { width:100%; text-align:left; padding:9px 10px 9px 16px; border-radius:4px; color:#1E293B; overflow:visible; text-overflow:clip; white-space:normal; overflow-wrap:anywhere; line-height:20px; }
    .child-btn:hover,.child-btn.active { background:rgba(255,255,255,.7); color:var(--tech); }

    .breadcrumb-bar { height:36px; display:flex; align-items:center; justify-content:space-between; padding:0 2px 0 0; color:#64748B; }
    .breadcrumb-left { display:flex; align-items:center; gap:8px; min-width:0; }
    .breadcrumb-home { width:18px; height:18px; color:#B8C4D3; }
    .page-title { font-size:13px; font-weight:800; color:#34445C; letter-spacing:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .panel { background:rgba(255,255,255,.86); border:1px solid rgba(223,232,246,.9); border-radius:8px; box-shadow:none; }
    .soft-panel { background:rgba(248,251,255,.8); border:1px solid #E1E9F6; border-radius:6px; }
    .btn { min-height:40px; display:inline-flex; align-items:center; justify-content:center; gap:7px; border-radius:4px; padding:9px 16px; font-weight:650; border:1px solid transparent; white-space:nowrap; }
    .btn-primary { background:var(--tech); color:#fff; }
    .btn-primary:hover { background:#245A91; }
    .btn-emerald { background:var(--emerald); color:#fff; }
    .btn-outline { color:#526276; background:#EEF3FB; border-color:#EEF3FB; }
    .btn-outline:hover { border-color:#C8DCFF; color:var(--tech); background:#E7F0FF; }
    .btn-danger { color:#fff; background:#DC2626; }
    .btn:disabled { opacity:.42; cursor:not-allowed; }
    .tag { display:inline-flex; align-items:center; gap:5px; border-radius:4px; padding:4px 8px; font-size:12px; font-weight:700; }
    .tag.green { color:#047857; background:#DFF7EA; }
    .tag.gray { color:#475569; background:#E5E7EB; }
    .tag.red { color:#B91C1C; background:#FEE2E2; }
    .tag.yellow { color:#92400E; background:#FEF3C7; }
    .tag.blue { color:#1D4ED8; background:#DBEAFE; }
    .input { min-height:40px; width:100%; border:1px solid #D7DFEB; background:#fff; border-radius:4px; padding:9px 12px; outline:none; color:#334155; }
    .input:focus { border-color:var(--tech); box-shadow:0 0 0 3px rgba(43,108,176,.14); }
    .input.error { border-color:#DC2626; box-shadow:0 0 0 3px rgba(220,38,38,.12); }
    .table-wrap { overflow:auto; border:0; border-radius:0; background:#fff; }
    table { width:100%; border-collapse:collapse; }
    th { background:#F7F9FC; color:#405064; font-size:13px; letter-spacing:0; text-align:left; padding:11px 16px; border-bottom:1px solid #EEF2F7; white-space:nowrap; user-select:none; font-weight:800; }
    td { padding:14px 16px; border-bottom:1px solid #E8EDF5; vertical-align:middle; color:#34445C; }
    tr:hover td { background:#F8FBFF; }
    .sortable { cursor:pointer; }
    .modal-scrim { position:fixed; inset:0; background:rgba(15,23,42,.52); z-index:90; display:none; align-items:center; justify-content:center; padding:24px; }
    .modal-scrim.show { display:flex; }
    .modal { background:#fff; border-radius:8px; width:min(980px,calc(100vw - 72px)); max-height:86vh; display:flex; flex-direction:column; box-shadow:0 22px 70px rgba(40,74,118,.24); }
    .modal.lg { width:min(1180px,calc(100vw - 72px)); }
    .modal-body { overflow:auto; padding:18px; }
    .drawer { position:fixed; top:64px; right:-420px; width:420px; bottom:0; z-index:70; background:#fff; border-left:1px solid #D9E2EF; box-shadow:-16px 0 36px rgba(15,23,42,.16); transition:right .22s ease; }
    .drawer.show { right:0; }
    #toastHost { position:fixed; right:18px; top:78px; z-index:120; display:grid; gap:10px; }
    .toast { min-width:260px; max-width:380px; color:#fff; padding:12px 14px; border-radius:8px; box-shadow:0 12px 30px rgba(15,23,42,.22); animation:slideIn .22s ease; }
    @keyframes slideIn { from { transform:translateX(20px); opacity:0; } to { transform:translateX(0); opacity:1; } }
    .skeleton { position:relative; overflow:hidden; background:#E8EEF6; border-radius:6px; }
    .skeleton:after { content:""; position:absolute; inset:0; transform:translateX(-100%); background:linear-gradient(90deg, transparent, rgba(255,255,255,.65), transparent); animation:shine 1.2s infinite; }
    @keyframes shine { to { transform:translateX(100%); } }
    .step { display:flex; align-items:center; gap:8px; color:#64748B; cursor:pointer; }
    .step .bubble { width:30px; height:30px; border-radius:999px; display:grid; place-items:center; background:#E2E8F0; font-weight:800; }
    .step.active { color:var(--tech); }
    .step.active .bubble,.step.done .bubble { color:#fff; background:var(--tech); }
    .periodic { display:grid; grid-template-columns:repeat(18,34px); gap:4px; align-items:center; }
    .el { width:34px; height:34px; border:1px solid #D7DEE9; border-radius:5px; display:grid; place-items:center; font-size:11px; font-weight:800; cursor:pointer; background:#fff; }
    .el.s { background:#E8F5FF; } .el.p { background:#EAF8F1; } .el.d { background:#FFF4DC; } .el.f { background:#F3E8FF; }
    .el.selected { outline:2px solid var(--tech); border-color:var(--tech); transform:translateY(-1px); }
    .tree details { margin:4px 0; }
    .tree summary { cursor:pointer; padding:7px 8px; border-radius:6px; font-weight:650; color:#1A365D; }
    .tree summary:hover { background:#EEF6FF; }
    .chart { height:260px; min-height:220px; }
    .viewer { height:260px; min-height:220px; background:#0F172A; border-radius:8px; overflow:hidden; }
    .virtual-list { max-height:420px; overflow-y:auto; }
    .hide { display:none !important; }
    .kbd { font-family:Consolas,monospace; border:1px solid #CBD5E1; border-bottom-width:2px; border-radius:4px; padding:1px 5px; background:#F8FAFC; }
  </style>

function initThree(id, mode="lattice"){
  const el=document.getElementById(id); if(!el || !window.THREE) return;
  el.innerHTML="";
  const scene=new THREE.Scene(); scene.background=new THREE.Color(0x0f172a);
  const camera=new THREE.PerspectiveCamera(45, el.clientWidth/el.clientHeight, .1, 100); camera.position.set(4,4,6);
  const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setSize(el.clientWidth, el.clientHeight); el.appendChild(renderer.domElement);
  const group=new THREE.Group(); scene.add(group);
  scene.add(new THREE.AmbientLight(0xffffff,.72)); const light=new THREE.DirectionalLight(0xffffff,.8); light.position.set(4,5,6); scene.add(light);
  const colors={C:0x222222,H:0xffffff,O:0xef4444,N:0x3b82f6,S:0xfacc15,Mo:0x94a3b8,W:0xa78bfa,Li:0xf97316,P:0xf59e0b,Cu:0xb45309};
  const atoms = mode==="molecule" ? [["C",0,0,0],["C",1.2,0,0],["O",2.1,.6,0],["H",-.6,.7,0],["H",-.6,-.7,0],["H",1.2,-.9,0]] :

  atoms.forEach(a=>{ const g=new THREE.SphereGeometry(a[0]==="H"?.13:.22,24,16); const m=new THREE.MeshStandardMaterial({color:colors[a[0]]||0x22c55e}); const s=new THREE.Mesh(g,m); s.position.set(a[1],a[2],a[3]); group.add(s); });
  for(let i=0;i<atoms.length-1;i++){ const a=new THREE.Vector3(atoms[i][1],atoms[i][2],atoms[i][3]), b=new THREE.Vector3(atoms[i+1][1],atoms[i+1][2],atoms[i+1][3]); const mid=a.clone().add(b).multiplyScalar(.5); const cyl=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,a.distanceTo(b),12),new THREE.MeshStandardMaterial({color:0x94a3b8})); cyl.position.copy(mid); cyl.lookAt(b); cyl.rotateX(Math.PI/2); group.add(cyl); }
  let dragging=false,lastX=0,lastY=0; el.onmousedown=e=>{dragging=true;lastX=e.clientX;lastY=e.clientY}; window.addEventListener("mouseup",()=>dragging=false);
  el.onmousemove=e=>{ if(dragging){ group.rotation.y+=(e.clientX-lastX)*.01; group.rotation.x+=(e.clientY-lastY)*.01; lastX=e.clientX; lastY=e.clientY; } };
  el.onwheel=e=>{ e.preventDefault(); camera.position.z=Math.max(2,Math.min(10,camera.position.z+e.deltaY*.005)); };
  function animate(){ if(!document.body.contains(el)) return; group.rotation.y+=.003; renderer.render(scene,camera); requestAnimationFrame(animate); }
  animate();
}

function renderDataTable(key, rows, columns, opts={}){
  const tableState = state.tables[key] || (state.tables[key]={page:1, sort:null, dir:1, q:""});
  const pageSize = opts.pageSize || 20;
  let filtered = rows.filter(r=>!tableState.q || JSON.stringify(r).toLowerCase().includes(tableState.q.toLowerCase()));
  if(tableState.sort){ filtered.sort((a,b)=> (a[tableState.sort]>b[tableState.sort]?1:-1)*tableState.dir); }
  const pages = Math.max(1, Math.ceil(filtered.length/pageSize));
  tableState.page = Math.min(tableState.page,pages);
  const start = (tableState.page-1)*pageSize;
  const pageRows = filtered.slice(start,start+pageSize);
  if(!pageRows.length){
    return `<div class="soft-panel p-8 text-center"><div class="mx-auto w-24 h-24 rounded-full bg-blue-50 border border-blue-100 grid place-items-center text-primary">${icon("search","w-10 h-10")}</div><h3 class="font-bold text-primary mt-4">暂无匹配数据</h3><p class="text-slate-500 mt-1">调整筛选条件或新增一条演示数据。</p></div>`;
  }
  return `<div class="flex items-center justify-between mb-2">
    <div class="text-slate-500">共 <span class="mono text-primary font-bold">${filtered.length}</span> 条，默认每页 ${pageSize} 条</div>
    ${opts.search!==false?`<input class="input !w-72" placeholder="表格内筛选" value="${tableState.q}" oninput="tableSearch('${key}',this.value)">`:""}
  </div><div class="table-wrap"><table><thead><tr>${opts.check?`<th><input type="checkbox" onclick="toggleAll('${key}',this.checked)"></th>`:""}${columns.map(c=>`<th class="${c.sort!==false?"sortable":""}" onclick="sortTable('${key}','${c.k}')">${c.t}${tableState.sort===c.k?(tableState.dir>0?" ▲":" ▼"):""}</th>`).join("")}${opts.actions?`<th>操作</th>`:""}</tr></thead><tbody>${pageRows.map((r,i)=>`<tr ${opts.rowClick?`onclick="${opts.rowClick}('${r.id}')"`:""}>${opts.check?`<td onclick="event.stopPropagation()"><input type="checkbox" class="${key}-check" value="${r.id}"></td>`:""}${columns.map(c=>`<td class="${c.mono?"mono":""}" ${c.edit?`contenteditable="${can("edit")}" onblur="inlineEdit('${opts.store}','${r.id}','${c.k}',this.textContent)"`:""}>${c.render?c.render(r):r[c.k]}</td>`).join("")}${opts.actions?`<td onclick="event.stopPropagation()">${opts.actions(r)}</td>`:""}</tr>`).join("")}</tbody></table></div>
  <div class="flex items-center justify-between mt-3"><div class="text-xs text-slate-500">第 ${tableState.page} / ${pages} 页</div><div class="flex gap-1"><button class="btn btn-outline" onclick="pageTable('${key}',-1)" ${tableState.page<=1?"disabled":""}>上一页</button><button class="btn btn-outline" onclick="pageTable('${key}',1)" ${tableState.page>=pages?"disabled":""}>下一页</button></div></div>`;
}
function tableSearch(k,v){ state.tables[k].q=v; state.tables[k].page=1; render(); }
function sortTable(k,field){ const s=state.tables[k]||(state.tables[k]={page:1}); if(s.sort===field) s.dir*=-1; else {s.sort=field;s.dir=1;} render(); }
function pageTable(k,d){ state.tables[k].page+=d; render(); }

function getChecked(key){ return [...document.querySelectorAll(`.${key}-check:checked`)].map(x=>x.value); }

function initIngestStep(){

    input.onchange=e=>handle(e.target.files); dz.ondragover=e=>{e.preventDefault();dz.classList.add("!border-tech")}; dz.ondrop=e=>{e.preventDefault();handle(e.dataTransfer.files);};
  }
  if(state.ingest.step===4 && !state.ingest.validation){
    let p=0; const t=setInterval(()=>{ p+=10; const bar=document.getElementById("valProgress"); if(bar) bar.style.width=p+"%"; if(p>=100){ clearInterval(t); state.ingest.validation={complete:true,reason:true,missing:6.3,issues:["字段 单位 未完全标准化","疑似重复数据 2 条","缺失值比例超过 5%"]}; renderIngest(); } },200);
  }
}

  if(s===2) return `<div class="grid grid-cols-2 gap-4"><div class="viewer" id="appView"></div><div id="appChart" class="chart"></div></div>`;
  if(s===3) return `<div class="grid grid-cols-3 gap-4">${["格式转换","材料生成","批量处理"].map(t=>`<button class="soft-panel p-8 text-left hover:!border-tech" onclick="toast('${t} 面板已打开')"><b class="text-primary">${t}</b><p class="text-slate-500 mt-2">上传、参数配置、任务提交与结果下载。</p></button>`).join("")}</div>`;
  return `<div class="grid grid-cols-2 gap-4"><div class="soft-panel p-5"><b>上传面板</b><input type="file" class="input mt-3"><button class="btn btn-primary mt-3" onclick="toast('共享上传完成')">上传共享</button></div><div class="soft-panel p-5"><b>下载与外部关联</b><div class="mt-3 flex gap-2"><button class="btn btn-outline" ${disabledIf("download")}>批量下载</button><button class="btn btn-outline">外部 DOI</button></div></div></div>`;
}

function renderAnalysis(){
  pageTitle("低维材料数据分析预测","算法中心、工具集与任务管理。");
  const tab=state.anTab||"算法中心";
  page.innerHTML = `<section class="panel p-4"><div class="flex gap-2 mb-4">${["算法中心","工具集","任务管理"].map(t=>`<button class="btn ${tab===t?"btn-primary":"btn-outline"}" onclick="state.anTab='${t}';renderAnalysis()">${t}</button>`).join("")}</div>${analysisHtml(tab)}</section>`;
}
function analysisHtml(tab){
  if(tab==="算法中心"){ const algos=["GNN-BandGap","DOSNet","PhononAI","SpectraFit","ElectrolyteRank","ChargeEQ","AdsorbNet","SankeyFlow","ManhattanGWAS"]; return `<div class="grid grid-cols-3 gap-4">${algos.map((a,i)=>`<button class="soft-panel p-5 text-left" onclick="createTask('${a}')"><div class="flex justify-between"><b class="text-primary">${a}</b><span class="tag ${i%4===0?"gray":"green"}">${i%4===0?"维护中":"可用"}</span></div><p class="text-slate-500 mt-2">输入：结构/表格/图谱文件；输出：预测值、置信区间、可视化报告。</p><span class="tag blue mt-3">${libs[i%5][1]}</span></button>`).join("")}</div>`; }
  if(tab==="工具集") return `<div class="grid grid-cols-5 gap-4">${["多目标逆向设计","智能清洗","模拟助手","催化剂设计","ML模型接口"].map(t=>`<button class="soft-panel p-5 text-left" onclick="openModal('${t}', '<p>参数配置、文件上传、执行日志和结果面板。</p><button class=\\'btn btn-primary mt-4\\' onclick=\\'toast(&quot;工具任务已提交&quot;);closeModal()\\'>提交</button>')"><b class="text-primary">${t}</b><p class="text-slate-500 mt-2">点击打开操作面板。</p></button>`).join("")}</div>`;
  return renderDataTable("tasks",data.tasks,[{k:"name",t:"名称"},{k:"algo",t:"算法"},{k:"status",t:"状态",render:r=>`<span class="tag ${r.status==="已完成"?"green":r.status==="失败"?"red":r.status==="排队中"?"yellow":"blue"}">${r.status}</span>`},{k:"time",t:"提交时间",mono:true},{k:"cost",t:"耗时",mono:true}],{actions:r=>taskActions(r)});
}
function createTask(algo){ openModal("任务创建向导",`<div class="grid grid-cols-2 gap-4"><label>上传文件<input type="file" class="input mt-1"></label><label>学习率<input class="input mt-1" value="0.001"></label><label>批大小<input class="input mt-1" value="64"></label><label>最大轮次<input class="input mt-1" value="120"></label></div><button class="btn btn-primary mt-5" onclick="submitTask('${algo}')">提交任务</button>`); }
function submitTask(algo){ closeModal(); const task={id:`T-${Date.now()}`,name:`${algo} 分析任务`,algo,status:"排队中",time:"2026-07-31 14:30",cost:"-"}; data.tasks.unshift(task); saveData(); toast("任务已提交，开始模拟进度","info"); state.anTab="任务管理"; renderAnalysis(); setTimeout(()=>{ task.status="运行中"; saveData(); renderAnalysis(); },1000); setTimeout(()=>{ task.status="已完成"; task.cost="3m 18s"; saveData(); renderAnalysis(); toast("分析任务已完成"); },4200); }
function taskActions(r){ if(r.status==="已完成") return `<button class="btn btn-outline !min-h-8" onclick="openModal('任务结果','<div id=\\'taskChart\\' class=\\'chart\\'></div>');setTimeout(()=>ech('taskChart',sparkLine('预测结果',C.emerald)),50)">查看结果</button>`; if(r.status==="失败") return `<button class="btn btn-outline !min-h-8" onclick="toast('日志：输入文件字段缺失','error')">日志</button><button class="btn btn-outline !min-h-8" onclick="rtry('${r.id}')">重试</button>`; if(r.status==="排队中") return `<button class="btn btn-outline !min-h-8" onclick="cancelTask('${r.id}')">取消</button>`; return `<span class="text-slate-400">运行中</span>`; }
function cancelTask(id){ data.tasks.find(t=>t.id===id).status="已取消"; saveData(); toast("任务已取消","warning"); renderAnalysis(); }
function rtry(id){ data.tasks.find(t=>t.id===id).status="排队中"; saveData(); toast("任务已重新排队"); renderAnalysis(); }

function renderSystem(){
  pageTitle("系统管理","用户、审核、版本、AI-Ready、审计日志与配置。");
  const tab=state.sysTab||"用户管理";
  page.innerHTML = `<section class="panel p-4"><div class="flex gap-2 mb-4 overflow-x-auto">${["用户管理","审核队列","数据版本","AI-Ready","审计日志","系统配置"].map(t=>`<button class="btn ${tab===t?"btn-primary":"btn-outline"}" onclick="state.sysTab='${t}';renderSystem()">${t}</button>`).join("")}</div>${systemHtml(tab)}</section>`;
}
function systemHtml(tab){
  if(tab==="用户管理") return `<div class="grid grid-cols-5 gap-3 mb-4"><input class="input" placeholder="搜索姓名/组织"><select class="input"><option>全部角色</option><option>管理员</option><option>研究员</option></select></div>${renderDataTable("users",data.users,[{k:"name",t:"姓名"},{k:"org",t:"组织"},{k:"role",t:"角色"},{k:"status",t:"状态",render:r=>`<span class="tag ${r.status==="启用"?"green":"red"}">${r.status}</span>`},{k:"time",t:"注册时间",mono:true}],{actions:r=>`<button class="btn btn-outline !min-h-8">编辑</button><button class="btn btn-outline !min-h-8" onclick="confirmBox('确认禁用','确定禁用 ${r.name}？',()=>toast('用户已禁用','warning'))">禁用</button><button class="btn btn-outline !min-h-8">重置密码</button>`})}`;
  if(tab==="审核队列") return renderDataTable("auditQueue",Array.from({length:12},(_,i)=>({id:`REV-${700+i}`,lib:libs[i%5][1],user:["张岚","王珩","李若水"][i%3],time:`2026-07-${20+i} 09:00`,status:["待审核","待复核","已驳回"][i%3]})),[{k:"id",t:"数据ID"},{k:"lib",t:"子库"},{k:"user",t:"提交人"},{k:"time",t:"提交时间",mono:true},{k:"status",t:"状态",render:r=>`<span class="tag ${r.status==="已驳回"?"red":"yellow"}">${r.status}</span>`}],{actions:r=>`<button class="btn btn-primary !min-h-8" onclick="toast('审核通过')">通过</button><button class="btn btn-outline !min-h-8" onclick="rejectModal('${r.id}')">驳回</button>`});
  if(tab==="数据版本") return `<div class="grid grid-cols-3 gap-4"><div>${["v1 创建","v2 补充图谱","v3 AI-Ready 修订"].map((x,i)=>`<button class="soft-panel p-4 w-full text-left mb-2" onclick="document.getElementById('diffBox').innerHTML=diffHtml(${i})"><b>${x}</b><div class="text-xs text-slate-500">2026-0${5+i}-12</div></button>`).join("")}</div><div id="diffBox" class="col-span-2">${diffHtml(0)}</div></div>`;
  if(tab==="AI-Ready") return `<div class="grid grid-cols-3 gap-4"><label>缺失值阈值 <span id="thrVal" class="mono">5%</span><input type="range" min="1" max="20" value="5" class="w-full mt-2" oninput="thrVal.textContent=this.value+'%'"></label><label class="col-span-2">存储格式<div class="flex gap-2 mt-2">${["HDF5","CSV","SQLite","JSON"].map(x=>`<label class="tag blue"><input type="checkbox" checked> ${x}</label>`).join("")}</div></label><label>单表最低记录数<input class="input mt-1" value="1000"></label><button class="btn btn-primary" onclick="toast('AI-Ready 配置已保存')">保存配置</button></div>`;
  if(tab==="审计日志") return `<div class="grid grid-cols-5 gap-3 mb-4"><input type="date" class="input"><input type="date" class="input"><button class="btn btn-outline" onclick="toast('审计日志导出完成')">导出</button></div>${renderDataTable("logs",data.audit,[{k:"time",t:"时间",mono:true},{k:"user",t:"用户"},{k:"action",t:"操作"},{k:"ip",t:"IP",mono:true}],{})}`;
  return `<div class="grid grid-cols-3 gap-4">${["注册审核开关","批量下载限制数值","任务队列并发数"].map((x,i)=>`<label class="soft-panel p-4"><b>${x}</b>${i===0?`<select class="input mt-3"><option>开启</option><option>关闭</option></select>`:`<input class="input mt-3" value="${i===1?5000:6}">`}</label>`).join("")}<button class="btn btn-primary" onclick="toast('系统配置已保存')">保存</button></div>`;
}
function rejectModal(id){ openModal("驳回原因",`<select class="input"><option>字段缺失</option><option>单位不一致</option><option>来源不可追溯</option></select><textarea class="input mt-3 h-28" placeholder="自由文本原因"></textarea><div class="mt-4 flex justify-end gap-2"><button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-danger" onclick="closeModal();toast('已驳回 ${id}','warning')">确认驳回</button></div>`); }
function diffHtml(i){ return `<div class="table-wrap"><table><thead><tr><th>字段</th><th>旧值</th><th>新值</th></tr></thead><tbody>${["band_gap","ai_ready","source","updated_by"].map((f,k)=>`<tr><td>${f}</td><td class="mono">${k+i}</td><td class="mono">${k+i+1}</td></tr>`).join("")}</tbody></table></div>`; }

function initGlobal(){
  roleSelect.value=state.role;
  roleSelect.onchange=e=>{ state.role=e.target.value; localStorage.setItem("ldm_role",state.role); toast(`已切换为${roles[state.role].label}`,"info"); if((state.page==="system"&&!can("sys")) || (state.role==="guest" && state.page!=="dashboard" && !state.page.startsWith("db-"))) state.page="dashboard"; render(); };
  collapseBtn.innerHTML=icon("menu","w-5 h-5");
  collapseBtn.onclick=()=>{ sidebar.classList.toggle("collapsed"); appShell.classList.toggle("collapsed"); };
  netErrBtn.onclick=()=>{ networkBanner.classList.remove("hidden"); toast("网络连接异常，部分功能不可用","error"); setTimeout(()=>networkBanner.classList.add("hidden"),5000); };
  render();
  setTimeout(()=>{ if(state.page==="apps" && state.appStep===2){ initThree("appView","lattice"); ech("appChart",sparkLine("内嵌分析图",C.tech)); } },50);
}
document.addEventListener("DOMContentLoaded", initGlobal);
</script>
</body>
</html>
