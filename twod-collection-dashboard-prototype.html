<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>二维材料数据采集加工处理 - 数据资源采集</title>
  <style>
    :root {
      --color-bg: #f4f7fb;
      --color-surface: #ffffff;
      --color-surface-soft: #f8fafc;
      --color-border: #dbe3ef;
      --color-border-strong: #b9c7dc;
      --color-primary: #183a8f;
      --color-primary-soft: #e8efff;
      --color-primary-dark: #10265f;
      --color-text: #111827;
      --color-muted: #64748b;
      --color-subtle: #94a3b8;
      --color-success: #15803d;
      --color-success-soft: #dcfce7;
      --color-warning: #b45309;
      --color-warning-soft: #fef3c7;
      --color-danger: #b91c1c;
      --color-danger-soft: #fee2e2;
      --color-info: #0369a1;
      --color-info-soft: #e0f2fe;
      --color-purple: #6d28d9;
      --color-purple-soft: #ede9fe;
      --color-acq-open: #2563eb;
      --color-acq-buy: #0f766e;
      --color-acq-calc: #f59e0b;
      --color-overlay: rgba(15, 23, 42, .48);
      --size-sidebar: 260px;
      --size-sidebar-narrow: 88px;
      --size-header: 72px;
      --size-radius: 6px;
      --size-radius-sm: 4px;
      --size-space-1: 4px;
      --size-space-2: 8px;
      --size-space-3: 12px;
      --size-space-4: 16px;
      --size-space-5: 20px;
      --size-space-6: 24px;
      --size-space-8: 32px;
      --size-control: 40px;
      --size-control-lg: 44px;
      --size-shadow-y: 12px;
      --size-shadow-blur: 34px;
      --font-size-xs: 12px;
      --font-size-sm: 13px;
      --font-size-base: 14px;
      --font-size-md: 16px;
      --font-size-lg: 18px;
      --font-size-xl: 22px;
      --font-size-2xl: 28px;
      --line-base: 1.55;
      --transition-fast: 160ms;
      --z-modal: 80;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--color-bg);
      color: var(--color-text);
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      font-size: var(--font-size-base);
      line-height: var(--line-base);
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .app-shell { display: grid; grid-template-columns: var(--size-sidebar) minmax(0, 1fr); min-height: 100vh; }
    .sidebar {
      background: #dcecff;
      border-right: 1px solid var(--color-border-strong);
      padding: var(--size-space-5) var(--size-space-4);
      position: sticky;
      top: 0;
      height: 100vh;
    }
    .brand { display: flex; align-items: center; gap: var(--size-space-3); margin-bottom: var(--size-space-6); }
    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid var(--color-primary);
      border-radius: 50%;
      color: var(--color-primary);
      font-weight: 900;
    }
    .brand h1 { margin: 0; color: var(--color-primary-dark); font-size: var(--font-size-lg); line-height: 1.25; }
    .brand span { display: block; color: var(--color-muted); font-size: var(--font-size-xs); font-weight: 600; }
    .nav-group-title { margin: var(--size-space-5) 0 var(--size-space-2); color: var(--color-primary-dark); font-weight: 900; }
    .nav-btn {
      width: 100%;
      min-height: var(--size-control-lg);
      display: flex;
      align-items: center;
      gap: var(--size-space-3);
      margin-bottom: var(--size-space-2);
      padding: 0 var(--size-space-3);
      border: 1px solid transparent;
      border-radius: var(--size-radius);
      background: transparent;
      color: var(--color-primary-dark);
      text-align: left;
      font-weight: 800;
      transition: background var(--transition-fast), border-color var(--transition-fast);
    }
    .nav-btn.active { background: var(--color-surface); border-color: var(--color-border); color: var(--color-primary); }
    .nav-icon {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      flex: 0 0 32px;
      border-radius: var(--size-radius-sm);
      background: var(--color-primary-soft);
      color: var(--color-primary);
      font-size: var(--font-size-xs);
      font-weight: 900;
    }
    .main { min-width: 0; }
    .topbar {
      height: var(--size-header);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--size-space-4);
      padding: 0 var(--size-space-6);
      border-bottom: 1px solid var(--color-border);
      background: #e7f1ff;
    }
    .topbar-title strong { display: block; color: var(--color-primary-dark); font-size: var(--font-size-lg); }
    .topbar-title span { color: var(--color-muted); font-size: var(--font-size-sm); }
    .user-chip {
      min-height: var(--size-control);
      display: inline-flex;
      align-items: center;
      gap: var(--size-space-2);
      padding: 0 var(--size-space-3);
      border: 1px solid var(--color-border);
      border-radius: 999px;
      background: var(--color-surface);
      color: var(--color-primary-dark);
      font-weight: 800;
    }
    .content { padding: var(--size-space-6); }
    .page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--size-space-4); margin-bottom: var(--size-space-5); }
    .page-head h2 { margin: 0; color: var(--color-primary-dark); font-size: var(--font-size-2xl); line-height: 1.25; }
    .page-head p { margin: var(--size-space-2) 0 0; color: var(--color-muted); max-width: 900px; }
    .section { border: 1px solid var(--color-border); background: var(--color-surface); border-radius: var(--size-radius); overflow: hidden; margin-bottom: var(--size-space-5); }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: var(--size-space-3); padding: var(--size-space-4) var(--size-space-5); border-bottom: 1px solid var(--color-border); }
    .section-head h3 { margin: 0; color: var(--color-primary-dark); font-size: var(--font-size-lg); }
    .section-head span { color: var(--color-muted); font-size: var(--font-size-sm); }
    .section-body { padding: var(--size-space-5); }
    .stat-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--size-space-4); }
    .stat-card { border: 1px solid var(--color-border); background: var(--color-surface); border-radius: var(--size-radius); padding: var(--size-space-4); min-height: 132px; }
    .stat-card h3 { margin: 0; color: var(--color-muted); font-size: var(--font-size-sm); }
    .stat-value { margin-top: var(--size-space-3); color: var(--color-text); font-size: var(--font-size-2xl); font-weight: 900; line-height: 1; }
    .trend { display: inline-flex; align-items: center; gap: var(--size-space-1); margin-top: var(--size-space-3); font-size: var(--font-size-xs); font-weight: 800; }
    .trend.up { color: var(--color-success); }
    .trend.down { color: var(--color-danger); }
    .workflow { display: grid; grid-template-columns: repeat(6, minmax(140px, 1fr)); gap: var(--size-space-3); overflow-x: auto; }
    .step { position: relative; min-height: 156px; padding: var(--size-space-4); border: 1px solid var(--color-border); border-radius: var(--size-radius); background: var(--color-surface-soft); }
    .step::after { content: ""; position: absolute; top: 34px; right: -10px; width: 16px; height: 2px; background: var(--color-border-strong); }
    .step:last-child::after { display: none; }
    .step-index { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; background: var(--color-primary); color: var(--color-surface); font-weight: 900; }
    .step h4 { margin: var(--size-space-3) 0 var(--size-space-2); color: var(--color-primary-dark); }
    .step ul { margin: 0; padding-left: var(--size-space-4); color: var(--color-muted); font-size: var(--font-size-sm); }
    .dash-grid { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: var(--size-space-5); }
    .stack-bar { display: flex; height: 34px; overflow: hidden; border-radius: var(--size-radius-sm); background: var(--color-border); }
    .stack-seg { display: flex; align-items: center; justify-content: center; color: var(--color-surface); font-size: var(--font-size-xs); font-weight: 900; }
    .legend-row { display: flex; flex-wrap: wrap; gap: var(--size-space-3); margin-top: var(--size-space-3); color: var(--color-muted); font-size: var(--font-size-sm); }
    .dot { width: 9px; height: 9px; display: inline-block; border-radius: 50%; margin-right: var(--size-space-1); }
    .timeline { display: grid; gap: var(--size-space-3); }
    .activity { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: var(--size-space-2); }
    .activity-dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; }
    .activity p { margin: 0; color: var(--color-text); }
    .activity time { display: block; margin-top: var(--size-space-1); color: var(--color-subtle); font-size: var(--font-size-xs); }
    .tabs { display: flex; gap: var(--size-space-2); flex-wrap: wrap; margin-bottom: var(--size-space-4); }
    .tab-btn {
      min-height: var(--size-control);
      padding: 0 var(--size-space-4);
      border: 1px solid var(--color-border);
      border-radius: var(--size-radius);
      background: var(--color-surface);
      color: var(--color-muted);
      font-weight: 800;
    }
    .tab-btn.active { border-color: var(--color-primary); background: var(--color-primary-soft); color: var(--color-primary); }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: var(--size-space-3); flex-wrap: wrap; margin-bottom: var(--size-space-3); }
    .btn, .btn-primary, .btn-danger {
      min-height: var(--size-control);
      border-radius: var(--size-radius-sm);
      padding: 0 var(--size-space-4);
      font-weight: 800;
      border: 1px solid var(--color-border-strong);
      background: var(--color-surface);
      color: var(--color-primary);
    }
    .btn-primary { border-color: var(--color-primary); background: var(--color-primary); color: var(--color-surface); }
    .btn-danger { border-color: var(--color-danger); color: var(--color-danger); }
    .btn-sm { min-height: 32px; padding: 0 var(--size-space-3); font-size: var(--font-size-xs); }
    .table-wrap { overflow: auto; border: 1px solid var(--color-border); border-radius: var(--size-radius); background: var(--color-surface); }
    table { width: 100%; min-width: 1020px; border-collapse: collapse; table-layout: fixed; }
    th, td { padding: var(--size-space-3); border-bottom: 1px solid var(--color-border); text-align: left; vertical-align: middle; }
    th { background: var(--color-primary-soft); color: var(--color-primary-dark); font-size: var(--font-size-sm); font-weight: 900; }
    td { color: var(--color-text); font-size: var(--font-size-sm); }
    tbody tr { transition: background var(--transition-fast); }
    tbody tr:hover { background: var(--color-surface-soft); }
    .clickable-row { cursor: pointer; }
    .cell { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .status { display: inline-flex; min-height: 24px; align-items: center; padding: 0 var(--size-space-2); border-radius: 999px; font-size: var(--font-size-xs); font-weight: 900; }
    .status.info { background: var(--color-info-soft); color: var(--color-info); }
    .status.success { background: var(--color-success-soft); color: var(--color-success); }
    .status.warn { background: var(--color-warning-soft); color: var(--color-warning); }
    .status.danger { background: var(--color-danger-soft); color: var(--color-danger); }
    .status.purple { background: var(--color-purple-soft); color: var(--color-purple); }
    .progress { height: 8px; border-radius: 999px; background: var(--color-border); overflow: hidden; }
    .progress span { display: block; height: 100%; background: var(--color-primary); transition: width var(--transition-fast); }
    .rule-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--size-space-4); }
    .rule-card { border: 1px solid var(--color-border); background: var(--color-surface-soft); border-radius: var(--size-radius); padding: var(--size-space-4); }
    .rule-card h4 { margin: 0 0 var(--size-space-2); color: var(--color-primary-dark); }
    .rule-card p { margin: 0; color: var(--color-muted); }
    .audit-layout { display: grid; grid-template-columns: 1fr; gap: var(--size-space-4); }
    .deviation-high { background: var(--color-danger-soft); }
    .modal-mask { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: var(--size-space-5); background: var(--color-overlay); z-index: var(--z-modal); }
    .modal-mask.show { display: flex; }
    .modal { width: min(860px, 100%); max-height: 88vh; display: flex; flex-direction: column; border-radius: var(--size-radius); background: var(--color-surface); box-shadow: 0 var(--size-shadow-y) var(--size-shadow-blur) rgba(15, 23, 42, .22); overflow: hidden; }
    .modal-head { display: flex; align-items: center; justify-content: space-between; gap: var(--size-space-3); padding: var(--size-space-4) var(--size-space-5); border-bottom: 1px solid var(--color-border); }
    .modal-head h3 { margin: 0; color: var(--color-primary-dark); }
    .modal-body { padding: var(--size-space-5); overflow: auto; }
    .modal-foot { display: flex; justify-content: flex-end; gap: var(--size-space-2); padding: var(--size-space-4) var(--size-space-5); border-top: 1px solid var(--color-border); background: var(--color-surface-soft); }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--size-space-4); }
    .field { display: grid; gap: var(--size-space-2); }
    .field.full { grid-column: 1 / -1; }
    .field label, .field span { color: var(--color-primary-dark); font-size: var(--font-size-sm); font-weight: 900; }
    input, select, textarea {
      width: 100%;
      min-height: var(--size-control);
      border: 1px solid var(--color-border-strong);
      border-radius: var(--size-radius-sm);
      background: var(--color-surface);
      color: var(--color-text);
      padding: 0 var(--size-space-3);
      outline: none;
    }
    textarea { min-height: 88px; padding: var(--size-space-3); resize: vertical; }
    input:focus, select:focus, textarea:focus { border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(24, 58, 143, .12); }
    .toast { position: fixed; right: var(--size-space-5); bottom: var(--size-space-5); width: min(420px, calc(100vw - 40px)); display: none; border: 1px solid var(--color-border); border-left: 4px solid var(--color-primary); border-radius: var(--size-radius); background: var(--color-surface); padding: var(--size-space-4); box-shadow: 0 var(--size-shadow-y) var(--size-shadow-blur) rgba(15, 23, 42, .18); z-index: 100; }
    .toast.show { display: block; }
    .toast strong { display: block; color: var(--color-primary-dark); }
    .toast span { display: block; margin-top: var(--size-space-1); color: var(--color-muted); }
    .empty { padding: var(--size-space-6); text-align: center; color: var(--color-muted); }
    @media (max-width: 1200px) {
      .stat-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .dash-grid, .rule-grid { grid-template-columns: 1fr; }
      .workflow { grid-template-columns: repeat(6, 190px); }
    }
    @media (max-width: 900px) {
      .app-shell { grid-template-columns: var(--size-sidebar-narrow) minmax(0, 1fr); }
      .sidebar { padding: var(--size-space-4) var(--size-space-2); }
      .brand { justify-content: center; }
      .brand h1, .nav-label, .nav-group-title { display: none; }
      .nav-btn { justify-content: center; padding: 0; }
      .nav-icon { margin: 0; }
      .content { padding: var(--size-space-4); }
      .form-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      .stat-grid { grid-template-columns: 1fr; }
      .page-head, .topbar { align-items: flex-start; flex-direction: column; height: auto; padding-top: var(--size-space-4); padding-bottom: var(--size-space-4); }
    }
  </style>
</head>
<body onload="App.init()">

      init() {
        this.render();
      },
      setView(view) {
        this.state.view = view;
        this.render();
      },
      setAcquireTab(tab) {
        this.state.acquireTab = tab;
        this.render();
      },
      setReviewTab(tab) {
        this.state.reviewTab = tab;
        this.render();
      },
      setAuditStatusTab(tab) {
        this.state.auditStatusTab = tab;
        this.render();
      },
      setUpdateTab(tab) {
        this.state.updateTab = tab;
        this.render();
      },
      render() {
        ["dashboard", "acquire", "review", "update"].forEach(key => {
          const btn = document.getElementById(`nav-${key}`);
          if (btn) btn.classList.toggle("active", this.state.view === key);
        });
        const app = document.getElementById("app");
        if (this.state.view === "dashboard") app.innerHTML = this.renderDashboard();
        if (this.state.view === "acquire") app.innerHTML = this.renderAcquire();
        if (this.state.view === "review") app.innerHTML = this.renderReview();
        if (this.state.view === "update") app.innerHTML = this.renderUpdate();
      },
      pageHead(title, desc, action) {
        return `<div class="page-head"><div><h2>${title}</h2><p>${desc}</p></div>${action || ""}</div>`;
      },
      statusClass(status) {
        if (["已完成", "已购买", "已通过", "成功"].includes(status)) return "success";
        if (["采集中", "审核中", "计算中", "同步中", "整合中", "后处理中"].includes(status)) return "info";
        if (["待审核", "排队中", "待同步", "谈判中", "续约中", "待计算", "待整合"].includes(status)) return "warn";
        if (["已驳回", "失败", "已过期"].includes(status)) return "danger";
        return "purple";
      },
      ratingClass(rating) {
        return rating === "高" ? "success" : rating === "中" ? "warn" : "danger";
      },
      progress(value) {
        return `<div class="progress" aria-label="进度 ${value}%"><span style="width:${value}%"></span></div>`;
      },
      renderDashboard() {
        return `
          ${this.pageHead("2.1 总览看板（Dashboard）", "默认展示二维材料数据资源采集的总体进展、流程、来源分布和最近活动。")}
          <div class="stat-grid">${this.data.stats.map(item => `<div class="stat-card"><h3>${item.label}</h3><div class="stat-value">${item.value}</div><div class="trend ${item.dir}">${item.dir === "up" ? "▲" : "▼"} ${item.trend}</div></div>`).join("")}</div>
          <section class="section" style="margin-top:var(--size-space-5);"><div class="section-head"><h3>总体工作流程图</h3><span>6 步闭环</span></div><div class="section-body"><div class="workflow">${this.data.workflow.map((step, i) => `<div class="step"><div class="step-index">${i + 1}</div><h4>${step.title}</h4><ul>${step.items.map(x => `<li>${x}</li>`).join("")}</ul></div>`).join("")}</div></div></section>
          <div class="dash-grid">
            <section class="section"><div class="section-head"><h3>采集方式分布图</h3><span>横向堆叠条形图</span></div><div class="section-body"><div class="stack-bar">${this.data.distribution.map(x => `<div class="stack-seg" style="width:${x.value}%;background:var(--color-acq-${x.cls});">${x.value}%</div>`).join("")}</div><div class="legend-row">${this.data.distribution.map(x => `<span><i class="dot" style="background:var(--color-acq-${x.cls})"></i>${x.label}</span>`).join("")}</div></div></section>
            <section class="section"><div class="section-head"><h3>最近活动流</h3><span>最近 8 条</span></div><div class="section-body"><div class="timeline">${this.data.activities.map(x => `<div class="activity"><i class="activity-dot" style="background:var(--color-acq-${x.type === "open" ? "open" : x.type === "buy" ? "buy" : x.type === "calc" ? "calc" : "open"})"></i><div><p>${x.text}</p><time>${x.time}</time></div></div>`).join("")}</div></div></section>

      renderAcquire() {

      renderPurchase() {

      },
      renderCompute() {
        return `<section class="section"><div class="section-head"><h3>数据计算任务</h3><button class="btn-primary" onclick="App.openModal('newCompute')">新建计算任务</button></div><div class="section-body">${this.table(["任务编号","目标材料","计算软件","计算方法","计算性质","截断能","K 点网格","状态","进度","操作"], this.data.computeTasks.map(t => [t.id, t.material, t.software, t.method, t.property, t.encut, t.kgrid, this.badge(t.status), this.progress(t.progress), `${t.status === "失败" ? `<button class="btn btn-sm" onclick="App.openModal('failReason','${t.id}')">失败原因</button> <button class="btn btn-sm" onclick="App.retryCompute('${t.id}')">重试</button>` : `<button class="btn btn-sm" onclick="App.advanceCompute('${t.id}')">推进</button>`}`]), "1280px")}</div></section>`;
      },
      renderReview() {
        const tab = this.state.reviewTab;
        return `
          ${this.pageHead("2.3 数据审核与整合模块", "审核通过自动进入数据整合，驳回退回数据获取端，偏差过大触发重新计算。")}
          <div class="tabs">
            <button class="tab-btn ${tab === "audit" ? "active" : ""}" onclick="App.setReviewTab('audit')">数据审核</button>
            <button class="tab-btn ${tab === "integration" ? "active" : ""}" onclick="App.setReviewTab('integration')">数据整合</button>
          </div>
          ${tab === "audit" ? this.renderAudit() : this.renderIntegration()}
        `;
      },
      renderAudit() {
        const sub = this.state.auditStatusTab;
        const map = { pending: "待审核", doing: "审核中", history: "历史" };
        const rows = this.data.audits.filter(x => sub === "history" ? ["已通过", "已驳回"].includes(x.status) : x.status === map[sub]);
        return `<section class="section"><div class="section-head"><h3>审核队列</h3><span>可信度、适用性、一致性</span></div><div class="section-body"><div class="tabs"><button class="tab-btn ${sub === "pending" ? "active" : ""}" onclick="App.setAuditStatusTab('pending')">待审核</button><button class="tab-btn ${sub === "doing" ? "active" : ""}" onclick="App.setAuditStatusTab('doing')">审核中</button><button class="tab-btn ${sub === "history" ? "active" : ""}" onclick="App.setAuditStatusTab('history')">审核历史</button></div>${this.table(["审核编号","材料名称","数据来源数","审核类型","一致性评级","状态","操作"], rows.map(t => [t.id, t.material, t.sources, t.type, `<span class="status ${this.ratingClass(t.rating)}">${t.rating}</span>`, this.badge(t.status), ["待审核","审核中"].includes(t.status) ? `<button class="btn btn-sm" onclick="App.openModal('auditDetail','${t.id}')">开始审核</button>` : `<button class="btn btn-sm" onclick="App.openModal('auditDetail','${t.id}')">查看</button>`]), "980px")}</div></section>`;
      },
      renderIntegration() {
        return `<section class="section"><div class="section-head"><h3>数据整合任务</h3><span>标准格式转换</span></div><div class="section-body"><div class="rule-grid"><div class="rule-card"><h4>结构和原子坐标</h4><p>转换为 .cif 文件，调用三维建模软件展示。</p></div><div class="rule-card"><h4>能带结构、态密度</h4><p>存储为数据文本，调用绘图软件展示。</p></div><div class="rule-card"><h4>弹性常数、杨氏模量</h4><p>按数值字段入库，保留单位和精度。</p></div></div><div style="height:var(--size-space-4)"></div>${this.table(["任务编号","材料名称","数据类型","原始格式","目标格式","整合状态","操作"], this.data.integrations.map(t => [t.id, t.material, t.dataType, t.raw, t.target, this.badge(t.status), `<button class="btn btn-sm" onclick="App.openModal('integrationDetail','${t.id}')">查看整合详情</button>`]), "960px")}</div></section>`;
      },
      renderUpdate() {
        const tab = this.state.updateTab;
        return `
          ${this.pageHead("2.4 数据更新模块", "现有数据库同步、新增材料计算计划和历史批次统一维护。")}
          <div class="tabs">
            <button class="tab-btn ${tab === "sync" ? "active" : ""}" onclick="App.setUpdateTab('sync')">现有数据更新</button>
            <button class="tab-btn ${tab === "new" ? "active" : ""}" onclick="App.setUpdateTab('new')">新增材料</button>
            <button class="tab-btn ${tab === "history" ? "active" : ""}" onclick="App.setUpdateTab('history')">更新历史</button>
          </div>
          ${tab === "sync" ? this.renderSync() : tab === "new" ? this.renderNewPlans() : this.renderHistory()}
        `;
      },
      renderSync() {
        return `<section class="section"><div class="section-head"><h3>更新任务列表</h3><span>同步完成后自动生成操作记录</span></div><div class="section-body">${this.table(["任务编号","来源数据库","更新范围","上次同步时间","新增/更新/删除","状态","进度","操作"], this.data.syncTasks.map(t => [t.id, t.source, t.range, t.last, `${t.add}/${t.update}/${t.del}`, this.badge(t.status), this.progress(t.progress), `<button class="btn btn-sm" onclick="App.startSync('${t.id}')">发起同步</button>`]), "1080px")}</div></section>`;
      },
      renderNewPlans() {
        return `<section class="section"><div class="section-head"><h3>新材料计算计划</h3><button class="btn-primary" onclick="App.openModal('newPlan')">新增计算计划</button></div><div class="section-body">${this.table(["计划编号","材料名称/化学式","待计算性质列表","优先级","预计完成时间","状态","操作"], this.data.newPlans.map(t => [t.id, `${t.material} / ${t.formula}`, t.props, t.priority, t.eta, this.badge(t.status), `<button class="btn btn-sm" onclick="App.finishPlan('${t.id}')">完成计算</button>`]), "980px")}</div></section>`;
      },
      renderHistory() {
        return `<section class="section"><div class="section-head"><h3>历史更新记录</h3><span>批次记录</span></div><div class="section-body">${this.table(["批次编号","更新时间","新增条目数","更新条目数","删除条目数","操作人","状态"], this.data.histories.map(t => [t.id, t.time, t.add, t.update, t.del, t.operator, this.badge(t.status)]), "920px")}</div></section>`;
      },
      table(headers, rows, minWidth, clickable) {
        if (!rows.length) return `<div class="empty">暂无数据</div>`;
        return `<div class="table-wrap"><table style="min-width:${minWidth}"><thead><tr>${headers.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(row => `<tr class="${clickable ? "clickable-row" : ""}">${row.map(cell => `<td><span class="cell" title="${String(cell).replace(/<[^>]+>/g, "")}">${cell}</span></td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
      },
      badge(status) {
        return `<span class="status ${this.statusClass(status)}">${status}</span>`;
      },
      field(id, label, type, options, value) {
        if (type === "select") return `<div class="field"><label>${label}</label><select id="${id}">${options.map(x => `<option value="${x}" ${x === value ? "selected" : ""}>${x}</option>`).join("")}</select></div>`;
        if (type === "textarea") return `<div class="field full"><label>${label}</label><textarea id="${id}">${value || ""}</textarea></div>`;
        return `<div class="field"><label>${label}</label><input id="${id}" type="${type || "text"}" value="${value || ""}"></div>`;
      },
      openModal(type, id) {
        this.state.modal = type;
        this.state.modalId = id || "";
        const modal = document.getElementById("modalMask");
        document.getElementById("modalTitle").textContent = this.modalTitle(type);
        document.getElementById("modalBody").innerHTML = this.modalBody(type, id);
        document.getElementById("modalFoot").innerHTML = this.modalFoot(type, id);
        modal.classList.add("show");
      },
      modalTitle(type) {
        const titles = { newOpen: "新建获取任务", openDetail: "获取任务详情", newPurchase: "新建购买申请", purchaseDetail: "许可详情", newCompute: "新建计算任务", failReason: "计算失败原因", auditDetail: "审核详情", integrationDetail: "整合详情", newPlan: "新增计算计划" };
        return titles[type] || "操作";
      },
      modalBody(type, id) {
        if (type === "newOpen") return `<div class="form-grid">${this.field("m1","获取方式","select",["开放数据库","文献整理"])}${this.field("m2","目标材料")}${this.field("m3","数据来源名称")}${this.field("m4","数据类型","select",["结构","能带","态密度","声子","弹性","光学","磁性"])}${this.field("m5","备注","textarea")}</div>`;
        if (type === "openDetail") { const t = this.data.openTasks.find(x => x.id === id); return `<p><strong>${t.id}</strong> · ${t.material}</p><p>来源：${t.source}；方式：${t.method}；类型：${t.dataType}</p><p>备注：${t.note}</p>${this.progress(t.progress)}`; }
        if (type === "newPurchase") return `<div class="form-grid">${this.field("m1","数据库名称")}${this.field("m2","许可类型","select",["商业用途","学术用途"])}${this.field("m3","预期费用")}${this.field("m4","许可期限")}${this.field("m5","申请理由","textarea")}</div>`;
        if (type === "purchaseDetail") { const t = this.data.purchases.find(x => x.id === id); return `<p><strong>${t.name}</strong></p><p>许可编号：${t.id}</p><p>许可期限：${t.term}</p><p>费用：${t.cost}</p><p>${t.detail}</p>`; }
        if (type === "newCompute") return `<div class="form-grid">${this.field("m1","材料")}${this.field("m2","计算软件","select",["VASP","Quantum ESPRESSO","ABINIT","SIESTA","Gaussian"])}${this.field("m3","计算方法","select",["DFT-PBE","DFT-GGA","HSE06","PBE+U","GW0"])}${this.field("m4","截断能")}${this.field("m5","K 点网格")}${this.field("m6","计算性质","select",["结构","能带","声子","弹性","光学","磁性"])}${this.field("m7","自动化流程描述","textarea","", "生成输入文件 → 提交队列 → 监控收敛 → 后处理 → 自动提交审核")}</div>`;
        if (type === "failReason") { const t = this.data.computeTasks.find(x => x.id === id); return `<p>${t.failReason}</p><p>可点击“重试”重新排队，系统将保留失败记录。</p>`; }
        if (type === "auditDetail") return this.auditDetailBody(id);
        if (type === "integrationDetail") { const t = this.data.integrations.find(x => x.id === id); return `<div class="rule-grid"><div class="rule-card"><h4>原始数据</h4><p>${t.raw} 格式，材料 ${t.material}，数据类型 ${t.dataType}</p></div><div class="rule-card"><h4>标准化处理</h4><p>字段映射、单位归一、异常值标记、格式校验。</p></div><div class="rule-card"><h4>最终格式</h4><p>输出为 ${t.target}，进入数据库发布队列。</p></div></div>`; }
        if (type === "newPlan") return `<div class="form-grid">${this.field("m1","材料名称")}${this.field("m2","化学式")}${this.field("m3","待计算性质列表")}${this.field("m4","优先级","select",["高","中","低"])}${this.field("m5","预计完成时间","date")}</div>`;
        return "";
      },
      modalFoot(type, id) {
        if (type === "auditDetail") return `<button class="btn-danger" onclick="App.rejectAudit('${id}')">驳回</button><button class="btn" onclick="App.triggerRecalc('${id}')">触发重新计算</button><button class="btn-primary" onclick="App.passAudit('${id}')">通过审核</button>`;
        if (["newOpen","newPurchase","newCompute","newPlan"].includes(type)) return `<button class="btn" onclick="App.closeModal()">取消</button><button class="btn-primary" onclick="App.saveModal()">保存</button>`;
        if (type === "failReason") return `<button class="btn" onclick="App.closeModal()">关闭</button><button class="btn-primary" onclick="App.retryCompute('${id}')">重试</button>`;
        return `<button class="btn-primary" onclick="App.closeModal()">关闭</button>`;
      },
      auditDetailBody(id) {
        const audit = this.data.audits.find(x => x.id === id);
        return `<p><strong>${audit.id}</strong> · ${audit.material} · ${audit.type}</p>${this.table(["来源","带隙值","形成能","计算参数","与均值偏差"], this.data.comparisons.map(x => [x.source, x.bandGap, x.formation, x.params, `<span class="status ${x.high ? "danger" : "success"}">${x.dev}</span>`]), "780px")}<div style="height:var(--size-space-4)"></div><div class="rule-card"><h4>一致性评估结果：${audit.rating}</h4><p>${audit.rating === "低" ? "存在偏差过大的来源，建议触发重新计算。" : "多来源结果基本一致，可进入审核结论确认。"}</p></div><div class="field full" style="margin-top:var(--size-space-4)"><label>审核意见</label><textarea id="auditOpinion" placeholder="通过审核可选填，驳回必须填写原因"></textarea></div>`;
      },
      closeModal() {
        document.getElementById("modalMask").classList.remove("show");
        this.state.modal = null;
        this.state.modalId = null;
      },
      val(id) { return document.getElementById(id)?.value || ""; },
      saveModal() {
        const type = this.state.modal;
        if (type === "newOpen") {
          this.data.openTasks.unshift({ id: `GET-${Date.now().toString().slice(-6)}`, material: this.val("m2"), source: this.val("m3"), method: this.val("m1") === "开放数据库" ? "词条搜索" : "文献整理", dataType: this.val("m4"), status: "采集中", progress: 0, created: "2026-08-03 18:00", note: this.val("m5") });
          this.pushActivity("open", `新建开源获取任务 ${this.val("m2")}`, "刚刚");
        }
        if (type === "newPurchase") {
          this.data.purchases.unshift({ id: `LIC-${Date.now().toString().slice(-4)}`, name: this.val("m1"), type: this.val("m2"), term: this.val("m4"), cost: this.val("m3"), status: "谈判中", detail: this.val("m5") });
          this.pushActivity("buy", `提交购买申请 ${this.val("m1")}`, "刚刚");
        }
        if (type === "newCompute") {
          const task = { id: `CAL-${Date.now().toString().slice(-6)}`, material: this.val("m1"), software: this.val("m2"), method: this.val("m3"), property: this.val("m6"), encut: this.val("m4"), kgrid: this.val("m5"), status: "排队中", progress: 0, failReason: "" };
          this.data.computeTasks.unshift(task);
          this.pushActivity("calc", `新建计算任务 ${task.material}，等待队列调度`, "刚刚");
        }
        if (type === "newPlan") {
          this.data.newPlans.unshift({ id: `PLAN-${Date.now().toString().slice(-4)}`, material: this.val("m1"), formula: this.val("m2"), props: this.val("m3"), priority: this.val("m4"), eta: this.val("m5"), status: "待计算" });
          this.pushActivity("calc", `新增材料计算计划 ${this.val("m1")}`, "刚刚");
        }
        this.closeModal();
        this.render();
        this.toast("保存成功", "已写入当前原型的 Mock Data。");
      },
      renewLicense(id) {
        const item = this.data.purchases.find(x => x.id === id);
        if (!item) return;
        item.status = "续约中";
        this.pushActivity("buy", `${item.name} 已进入续约中`, "刚刚");
        this.render();
        this.toast("续约已发起", "许可状态已更新为续约中。");
      },
      advanceCompute(id) {
        const t = this.data.computeTasks.find(x => x.id === id);
        if (!t) return;
        if (t.status === "排队中") { t.status = "计算中"; t.progress = 25; }
        else if (t.status === "计算中") { t.status = "后处理中"; t.progress = 82; }
        else if (t.status === "后处理中") {
          t.status = "已完成"; t.progress = 100;
          this.data.audits.unshift({ id: `AUD-${Date.now().toString().slice(-4)}`, material: t.material, sources: 1, type: "适用性评估", rating: "中", status: "待审核" });
          this.pushActivity("calc", `${t.material} 计算完成并自动提交审核`, "刚刚");
        }
        this.render();
      },
      retryCompute(id) {
        const t = this.data.computeTasks.find(x => x.id === id);
        if (!t) return;
        t.status = "排队中"; t.progress = 0; t.failReason = "";
        this.closeModal();
        this.render();
        this.toast("计算任务已重试", `${t.id} 已重新进入队列。`);
      },
      passAudit(id) {
        const audit = this.data.audits.find(x => x.id === id);
        if (!audit) return;
        audit.status = "已通过";
        this.data.integrations.unshift({ id: `INT-${Date.now().toString().slice(-5)}`, material: audit.material, dataType: audit.type, raw: "多来源数据", target: audit.type === "一致性比对" ? "数字" : "文本", status: "待整合" });
        this.pushActivity("review", `${audit.material} 审核通过并自动进入数据整合`, "刚刚");
        this.closeModal();
        this.render();
        this.toast("审核通过", "数据已进入整合任务列表。");
      },
      rejectAudit(id) {
        const opinion = this.val("auditOpinion");
        if (!opinion.trim()) { this.toast("需要驳回原因", "驳回审核前请填写审核意见。"); return; }
        const audit = this.data.audits.find(x => x.id === id);
        if (!audit) return;
        audit.status = "已驳回";
        this.data.openTasks.unshift({ id: `GET-${Date.now().toString().slice(-6)}`, material: audit.material, source: "退回重采", method: "文献整理", dataType: audit.type, status: "采集中", progress: 0, created: "2026-08-03 18:10", note: opinion });
        this.pushActivity("review", `${audit.material} 审核驳回并退回数据获取端`, "刚刚");
        this.closeModal();
        this.render();
      },
      triggerRecalc(id) {
        const audit = this.data.audits.find(x => x.id === id);
        if (!audit) return;
        this.data.computeTasks.unshift({ id: `CAL-${Date.now().toString().slice(-6)}`, material: audit.material, software: "VASP", method: "DFT-PBE", property: "重新计算", encut: "500 eV", kgrid: "15x15x1", status: "排队中", progress: 0, failReason: "" });
        this.pushActivity("calc", `${audit.material} 偏差过大，已触发重新计算`, "刚刚");
        this.toast("已触发重新计算", "新计算任务已加入队列。");
        this.closeModal();
        this.render();
      },
      startSync(id) {
        const t = this.data.syncTasks.find(x => x.id === id);
        if (!t) return;
        if (!confirm(`确认发起 ${t.source} 同步吗？`)) return;
        t.status = "同步中"; t.progress = 0;
        this.render();
        const timer = setInterval(() => {
          t.progress += 25;
          if (t.progress >= 100) {
            t.progress = 100; t.status = "已完成"; t.last = "2026-08-03 18:20";
            this.data.histories.unshift({ id: `BATCH-${Date.now().toString().slice(-8)}`, time: t.last, add: t.add, update: t.update, del: t.del, operator: "system", status: "成功" });
            this.pushActivity("update", `${t.source} 同步完成并生成更新历史`, "刚刚");
            clearInterval(timer);
          }
          this.render();
        }, 260);
      },
      finishPlan(id) {
        const t = this.data.newPlans.find(x => x.id === id);
        if (!t) return;
        t.status = "已完成";
        this.data.audits.unshift({ id: `AUD-${Date.now().toString().slice(-4)}`, material: t.material, sources: 1, type: "适用性评估", rating: "中", status: "待审核" });
        this.pushActivity("calc", `${t.material} 新材料计算完成并自动进入审核`, "刚刚");
        this.render();
        this.toast("计算计划完成", "已自动生成待审核记录。");
      },
      pushActivity(type, text, time) {
        this.data.activities.unshift({ type, text, time });
        this.data.activities = this.data.activities.slice(0, 8);
      },
      toast(title, body) {
        document.getElementById("toastTitle").textContent = title;
        document.getElementById("toastBody").textContent = body;
        const box = document.getElementById("toast");
        box.classList.add("show");
        setTimeout(() => box.classList.remove("show"), 2600);
      }
    };
  </script>
</body>
</html>
