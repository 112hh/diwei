<!DOCTYPE html>

  <title>低维材料主题库门户</title>
  <style id="lanhu-style">
    :root{
      --lanhu-bg:#dcecff;
      --lanhu-primary:#1f63ff;
      --lanhu-text:#1f2d3d;
      --lanhu-muted:#6b7b91;
      --lanhu-card:rgba(255,255,255,.88);
      --lanhu-line:#d7e4f8;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      min-width:1280px;
      display:grid;
      place-items:center;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;
      color:var(--lanhu-text);
      background:linear-gradient(118deg,#cfe3ff 0%,#eaf4ff 48%,#d8e9ff 100%);
    }
    .shell{
      width:420px;
      padding:28px;
      border:1px solid rgba(255,255,255,.92);
      border-radius:8px;
      background:var(--lanhu-card);
      text-align:center;
    }
    .mark{
      width:44px;
      height:44px;
      margin:0 auto 14px;
      border-radius:999px;
      display:grid;
      place-items:center;
      color:var(--lanhu-primary);
      background:#fff;
      border:1px solid rgba(31,99,255,.32);
      box-shadow:0 2px 8px rgba(31,99,255,.14);
    }
    h1{margin:0;font-size:18px;line-height:28px;font-weight:800}
    p{margin:8px 0 18px;color:var(--lanhu-muted);font-size:14px}
    a{
      min-height:40px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:0 22px;
      border-radius:999px;
      background:var(--lanhu-primary);
      color:#fff;
      font-weight:700;
      text-decoration:none;
    }
  </style>
  <style >/*
 * UI Design System Preset
 * Source: UI设计规范文档.docx, Shenzhen International Science and Technology Information Center.
 * Scope: B-end admin pages, portal shell, prototype pages, and future additions.
 */

:root {
  /* Brand */
  --color-primary: #1677ff;
  --color-primary-hover: #4096ff;
  --color-primary-active: #0958d9;
  --color-primary-light: #e6f4ff;

  /* Semantic */
  --color-success: #52c41a;
  --color-success-hover: #73d13d;
  --color-warning: #faad14;
  --color-warning-hover: #ffa940;
  --color-warning-icon: #fa8c16;
  --color-danger: #ff4d4f;
  --color-danger-hover: #ff7875;
  --color-danger-active: #d9363e;

  /* Text */
  --color-text-title: #1a1a2e;
  --color-text-primary: #262626;
  --color-text-body: #333333;
  --color-text-secondary: #595959;
  --color-text-tertiary: #666666;
  --color-text-muted: #8c8c8c;
  --color-text-placeholder: #bfbfbf;
  --color-text-disabled: #bfbfbf;
  --color-text-inverse: #ffffff;

  /* Surface */
  --color-border: #d9d9d9;
  --color-border-light: #e8e8e8;
  --color-divider: #f0f0f0;
  --color-bg-page: #f5f7fa;
  --color-bg-component: #ffffff;
  --color-bg-hover: #f5f5f5;
  --color-bg-selected: #e6f4ff;
  --color-bg-table-head: #f5f5f5;

  /* Radius */
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --radius-xl: 12px;
  --radius-circle: 50%;
  --radius-pill: 9999px;

  /* Shadow */
  --shadow-1: 0 2px 8px 0 rgba(0, 0, 0, 0.05);
  --shadow-2: 0 4px 16px 0 rgba(0, 0, 0, 0.08);
  --shadow-3: 0 2px 8px 2px rgba(0, 0, 0, 0.05), 0 4px 16px 2px rgba(0, 0, 0, 0.08), 0 8px 32px 2px rgba(0, 0, 0, 0.1);
  --shadow-4: 0 4px 8px 2px rgba(0, 0, 0, 0.08), 0 8px 16px 2px rgba(0, 0, 0, 0.1), 0 16px 32px 2px rgba(0, 0, 0, 0.1);

  /* Spacing */
  --spacing-xs: 4px;
  --spacing-sm: 8px;
  --spacing-md: 12px;
  --spacing-base: 16px;
  --spacing-lg: 24px;
  --spacing-xl: 32px;
  --spacing-2xl: 48px;

  /* Type */
  --font-family-system: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  --font-size-display: 20px;
  --font-size-h1: 18px;
  --font-size-h2: 16px;
  --font-size-h3: 14px;
  --font-size-body: 14px;
  --font-size-caption: 12px;

  /* Component size */
  --btn-height-lg: 40px;
  --btn-height-md: 32px;
  --btn-height-sm: 24px;
  --input-height: 32px;
  --modal-width: 520px;
  --drawer-width-notification: 380px;
  --drawer-width-form: 500px;

  /* Layout */
  --header-height: 64px;
  --topbar-height: 64px;
  --sider-width: 256px;
  --sidebar-width: 256px;
  --sider-width-collapsed: 64px;
  --sidebar-collapsed: 64px;
  --secondary-header-height: 48px;
  --content-padding: 24px;
  --page-padding: 24px;

  /* Existing project aliases */
  --bg: var(--color-bg-page);
  --bg-alt: var(--color-bg-page);
  --panel: var(--color-bg-component);
  --panel-soft: #fafafa;
  --line: var(--color-border-light);
  --line-strong: var(--color-border);
  --text: var(--color-text-primary);
  --muted: var(--color-text-secondary);
  --primary: var(--color-primary);
  --primary-soft: var(--color-primary-light);
  --primary-strong: var(--color-primary-active);
  --danger: var(--color-danger);
  --warning: var(--color-warning);
  --success: var(--color-success);

  --transition-fast: all 0.15s ease;
  --transition-base: all 0.2s ease;
  --transition-slow: all 0.3s ease;
}

    grid-template-columns: minmax(140px, 1fr) auto !important;
  }

  .top-search {
    width: min(100%, 260px) !important;
  }

  .main {
    margin: 0 8px 12px !important;
  }

  .hero-content,
  .scene-content,
  .material-convert-grid,
  .catalyst-build-topbar,
  .catalyst-build-layout,
  .catalyst-build-flow,
  .twod-detail-layout,
  .electrolyte-main-column {
    grid-template-columns: 1fr !important;
  }
}

/*
 * Canonical Lanhu-aligned application layer.
 * This final layer keeps legacy page-local rules from drifting away from the
 * shared source of truth while preserving the existing page structure.
 */
:root {
  --sider-width: 200px !important;
  --sidebar-width: 200px !important;
  --sider-width-collapsed: 64px !important;
  --sidebar-collapsed: 64px !important;
  --header-height: 64px !important;
  --topbar-height: 64px !important;
  --secondary-header-height: 48px !important;
  --content-padding: 16px !important;
  --page-padding: 16px !important;
  --shell-bg: linear-gradient(118deg, #cfe3ff 0%, #eaf4ff 48%, #d8e9ff 100%) !important;
  --surface-glass: rgba(255, 255, 255, 0.88) !important;
  --surface-soft: rgba(248, 251, 255, 0.82) !important;
}

html,
body {
  background: var(--shell-bg) !important;
  color: var(--color-text-primary) !important;
}

body {
  font-family: var(--font-family-system) !important;
  font-size: var(--font-size-body) !important;
  line-height: 1.5 !important;
  letter-spacing: 0 !important;
}

.app,
.app-shell {
  grid-template-columns: var(--sider-width) minmax(0, 1fr) !important;
  grid-template-rows: var(--header-height) minmax(0, 1fr) !important;
  background: transparent !important;
}

.app.sidebar-collapsed,
.app-shell.collapsed {
  grid-template-columns: var(--sider-width-collapsed) minmax(0, 1fr) !important;
}

.topbar,
.header,
.top-nav {
  min-height: var(--header-height) !important;
  height: var(--header-height) !important;
  background: rgba(207, 226, 255, 0.86) !important;
  border-bottom: 0 !important;
  box-shadow: none !important;
  backdrop-filter: blur(14px) !important;
}

.topbar-inner {
  min-height: var(--header-height) !important;
  height: var(--header-height) !important;
  padding-inline: 16px !important;
}

.brand-mark,
.logo-mark {
  width: 32px !important;
  height: 32px !important;
  border-radius: var(--radius-circle) !important;
  background: #ffffff !important;
  border: 1px solid rgba(22, 119, 255, 0.22) !important;
  box-shadow: var(--shadow-1) !important;
}
